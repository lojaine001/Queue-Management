# (conf, area, ratio)
snapshot_classes:
  [
    'TaxiSign'
  ]

# Tracker backend: norfair | sort | bytetrack
tracker: norfair

track_all: False

debug_mode: True

show_ids: False

show_rejected_track_overlay: False

# OpenVINO execution provider settings (used when --execution_provider openvino)
openvino_device: CPU       # CPU | GPU | NPU (MYRIAD is accepted as a legacy alias)
openvino_precision: FP32   # FP32 | FP16

expect_fps: 3

max_age: 9

max_distance_between_points: 3

save_one: True

# Set to False to disable saving debug snapshot images to disk
save_snapshots: False

pretrained_classes:
  [
    'car', 'bus', 'train', 'truck', 'boat'
  ]


min_iou: 0.1

tip_offset: 0.5

# ── Equipment classifier ──────────────────────────────────────────────────────
# Path to a custom YOLOv8-style ONNX model trained on:
#   class 0 → trolley, class 1 → store_basket, class 2 → personal_bag
# Leave empty ("") to skip model-based classification.
equipment_model: ""

# Minimum detection confidence for the ONNX model
equipment_score_thresh: 0.40

# Set to true to use the colour-heuristic fallback (no model needed).
# Thresholds are approximate — tune for your specific camera/lighting.
equipment_heuristic: true

# Show equipment label below dwell time on the video overlay
show_equipment_labels: true

# ── OWLv2 zero-shot caddy/basket detection ───────────────────────────────────
# Runs alongside the main YOLO loop at very low frame rate to detect
# trolleys and baskets without any training data.
# Set owlv2_enabled to false to disable entirely.
# owlv2_interval_frames: run OWLv2 every N frames (3fps × 30 = every 10s).
# owlv2_score_thresh: minimum confidence (0–1); 0.15 is a safe default.
owlv2_enabled:         true
owlv2_interval_frames: 30
owlv2_score_thresh:    0.10

# ── Queue quality filter ──────────────────────────────────────────────────────
# Tracks shorter than this (seconds) are passer-by noise; excluded from
# service_events and queue snapshot counts.
queue_min_dwell_sec: 3.0

# ── Caddy / basket dataset collection ────────────────────────────────────────
# Save one raw frame every N seconds to caddy_frames/ for future training.
# Set caddy_collect_interval_sec to 0 to disable collection entirely.
# Collection stops automatically when the folder reaches caddy_collect_max_gb GB.
caddy_collect_interval_sec: 0
caddy_collect_max_gb: 2.0




