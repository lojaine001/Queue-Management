# Database migrations (Alembic). Run from the project root:
#   alembic -c db/alembic.ini upgrade head     apply every migration not yet applied
#   alembic -c db/alembic.ini current          show the version the database is at
# Connection settings come from .env (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD).
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
