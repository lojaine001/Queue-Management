# ── Fisheye Detector Model Configuration ──────────────────────────────────────
# Supported detector_backend values:
#   auto        infer from model extension (.onnx, .pt, .engine, .ckpt) or wbf_models
#   onnx        ONNX Runtime (CPU, CUDA, OpenVINO on Xeon/NPU, TensorRT)
#   yolov10     UT_AICITY2025_Track4 YOLOv10-X (.pt or .engine)
#   yolov13     UT_AICITY2025_Track4 YOLOv13-L (.pt or .engine)
#   yolor       UT_AICITY2025_Track4 YOLOR-D6 (.pt)
#   wbf         UT_AICITY2025_Track4 3-model Weighted Boxes Fusion (YOLOR + YOLOv10 + YOLOv13)
#   rapid       RAPiD rotation-aware fisheye detector (.ckpt, e.g. pL1_MWHB1024_Mar11_4000.ckpt)
detector_backend: auto

# Active single-model path (.onnx, .pt, .engine, or .ckpt) in Fisheye-Detector/models/:
#   - models/rapid_pL1_MWHB1024_Mar11_4000.onnx   (RAPiD 1024x1024 ONNX for OpenVINO / CUDA / CPU)
#   - models/yolov10_x_best_checkpoint.onnx       (UT_AICITY2025 YOLOv10-X 1280x1280 ONNX)
#   - models/yolov13_l_best_checkpoint.onnx       (UT_AICITY2025 YOLOv13-L 1280x1280 ONNX)
#   - models/yolor_d6_best_checkpoint.onnx        (UT_AICITY2025 YOLOR-D6 1280x1280 ONNX)
#   - models/pL1_MWHB1024_Mar11_4000.ckpt         (RAPiD 1024x1024 PyTorch checkpoint)
#   - models/yolov10_x_best_checkpoint.pt         (UT_AICITY2025 YOLOv10-X PyTorch checkpoint)
#   - models/yolov13_l_best_checkpoint.pt         (UT_AICITY2025 YOLOv13-L PyTorch checkpoint)
#   - models/yolor_d6_best_checkpoint.pt          (UT_AICITY2025 YOLOR-D6 PyTorch checkpoint)
custom_model: models/rapid_pL1_MWHB1024_Mar11_4000.onnx
disable_headpose_identification_mode: True

# Inference image size (1280 for UT_AICITY2025_Track4 YOLO models; 1024 for RAPiD; 640 for standard YOLO)
img_size: 1280
iou_threshold: 0.45
detect_full_res: True

# Class IDs treated as Person/Pedestrian and normalized to Box(classid=0):
#   - 3: Pedestrian in UT_AICITY2025_Track4 (Fisheye8K / VisDrone 5-class: 0=Bus, 1=Bike, 2=Car, 3=Pedestrian, 4=Truck)
#   - 0: Person/Head in COCO / single-class head/person models
# Leave commented out (null) to auto-detect from the model's number of classes.
# person_class_ids: [3, 0]

# Optional 3-model WBF ensemble configuration (used when detector_backend: wbf)
wbf_models:
  yolor: models/yolor_d6_best_checkpoint.onnx
  y10:   models/yolov10_x_best_checkpoint.onnx
  y13:   models/yolov13_l_best_checkpoint.onnx
wbf_weights: [9.0, 9.0, 9.0]
wbf_iou: 0.65

# Optional RAPiD configuration (used when detector_backend: rapid or custom_model ends with .ckpt)
# rapid_dir: ../RAPiD
# rapid_backbone: dark53

score: 0.15
min_delay: 0.45

